<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="budget.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"/>
    <title>Expenses Tracker</title>
</head>
<body>
    <div class="content">
        <div id="enterDetails">
            <button onclick="viewHistory()" id="history">View History</button>
            <h1>Expenses Tracker</h1>
            <div class="field">
                <h2 class="fieldName">Amount spent</h2>
                <input type="text" id="Amount-spent">
            </div>
            <div class="field">
                <h2 class="fieldName">Expense name</h2>
                <input type="text" id="Expense-name">
            </div>
            <div class="field" id="expenseType">
                <h2 class="fieldName">Type of expense</h2>
                <select id="expenseCategory">
                    <option value="" selected disabled>Select Category</option>
                    <option>Meals</option>
                    <option>Snacks</option>
                    <option>Necessities</option>
                    <option>Miscallaneous</option>
                    <option>Lifestyle</option>
                </select>
                <div class="arrow">
                    <i class="fa-solid fa-sort-down"></i>
                </div>
            </div>
            <div class="addExpense">
                <button onclick="addExpense()">Add Expense</button>
            </div>

            <div id="categoryTotals">
                <h2>Category totals</h2>
                <p>Meals: <span id="mealsTotal">0</span></p>
                <p>Snacks: <span id="snacksTotal">0</span></p>
                <p>Necessities: <span id="neccTotal">0</span></p>
                <p>Miscallaneous: <span id="miscTotal">0</span></p>
                <p>Lifestyle: <span id="lifeTotal">0</span></p>
            </div>
        </div>
        <div id="historySection">
            <h1>Expense History</h1>
            <div class="field">
                <h2><label for="searchExpense">Search by expense name</label></h2>
                <input type="text" id="searchExpense" oninput="showExpenses()" placeholder="Search transactions">
            </div>
            <div class="field">
                <h2><label>Filter by category</label></h2>
                <select id="filterCategory" onclick="showExpenses()">
                    <option value="">All categories</option>
                    <option value="meals">Meals</option>
                    <option value="snacks">Snacks</option>
                    <option value="necc">Necessities</option>
                    <option value="misc">Miscallaneous</option>
                    <option value="life">Lifestyle</option>
                </select>
            </div>
            <div id="historyExpense"></div>
        </div>
        <div id="goBack">
            <button onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> </button>
        </div>
        
    </div>
    
    
    <script src="budget.js"></script>
</body>
</html>
